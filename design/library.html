<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Books library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#26432F}a:hover{color:#16291C}
</style>
</helmet>
<div style="width: 390px; height: 980px; box-sizing: border-box; background: #F3EADB; color: #2A2118; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="flex: 1; padding: 24px 20px 0; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 30px">Library</h1>
<button aria-label="Add a book" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #26432F; color: #F3EADB; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>

<div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; background: #FBF6EC; border: 1px solid #E2D5BF; border-radius: 14px; box-sizing: border-box">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5D4D" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
<label for="lib-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search your library</label>
<input id="lib-search" type="search" placeholder="Search title, author or genre" style="flex: 1; border: none; background: transparent; font: inherit; font-size: 15px; color: #2A2118; outline: none">
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E8DCC6; border-radius: 14px">
<button style="height: 44px; border: none; border-radius: 10px; background: #26432F; color: #F3EADB; font: inherit; font-size: 14px; font-weight: 600">Read · 27</button>
<button style="height: 44px; border: none; border-radius: 10px; background: transparent; color: #4A3F33; font: inherit; font-size: 14px; font-weight: 500">Reading · 1</button>
<button style="height: 44px; border: none; border-radius: 10px; background: transparent; color: #4A3F33; font: inherit; font-size: 14px; font-weight: 500">TBR · 12</button>
</div>

<div style="display: flex; justify-content: space-between; font-size: 13px; color: #6B5D4D">
<div>Sorted by date finished</div>
<div style="font-weight: 600; color: #26432F">Filter</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 12px">
<sc-for list="{{books}}" as="b" hint-placeholder-count="9">
<a href="BookDetail.dc.html" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #2A2118">
<div style="height: 136px; border-radius: 4px 8px 8px 4px; background: {{b.c}}; color: #FBF6EC; font-family: Fraunces, Georgia, serif; font-size: 14px; line-height: 1.2; display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box; box-shadow: inset 5px 0 0 rgba(0,0,0,0.18)">{{b.t}}</div>
<div style="font-size: 12px; color: #6B5D4D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.a}}</div>
<div role="img" aria-label="{{b.label}}" style="position: relative; font-size: 14px; line-height: 16px; width: max-content; color: #D6C8AE">★★★★★<div style="position: absolute; left: 0; top: 0; overflow: hidden; white-space: nowrap; width: {{b.w}}; color: #A56A12">★★★★★</div></div>
</a>
</sc-for>
</div>

</div>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #E2D5BF; background: #FBF6EC; padding: 8px 0 14px; margin-top: 16px">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #6B5D4D; text-decoration: none">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
Home</a>
<a href="BookLibrary.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 600; color: #26432F; text-decoration: none">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v16M9 4v16M13 5l4 15M19 4v16"></path></svg>
Library</a>
<a href="BookStats.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 11px; font-weight: 500; color: #6B5D4D; text-decoration: none">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
Stats</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
renderVals() {
var raw = [
['Project Hail Mary', 'Andy Weir', 5, '#26432F'],
['The Name of the Wind', 'Patrick Rothfuss', 4.5, '#7C2F2B'],
['Meditations', 'Marcus Aurelius', 4, '#4A5568'],
['The Martian', 'Andy Weir', 4.5, '#B5652E'],
['Atomic Habits', 'James Clear', 3.5, '#8A6D1F'],
['Nineteen Eighty Four', 'George Orwell', 5, '#3B2F2F'],
['The Hobbit', 'J. R. R. Tolkien', 4.5, '#35603F'],
['Deep Work', 'Cal Newport', 3, '#2F4A66'],
['Shogun', 'James Clavell', 5, '#6B2D3A']
];
var books = raw.map(function (r) {
return { t: r[0], a: r[1], c: r[3], w: (r[2] * 20) + '%', label: r[2] + ' out of 5 stars' };
});
return { books: books };
}
}
</script>
</body>
</html>
